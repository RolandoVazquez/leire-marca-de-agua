<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leire - Marca de Agua</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de Carga (Splash Screen) -->
  <div id="splash-screen">
    <h1 class="splash-logo">Leire</h1>
  </div>

  <!-- Contenedor Principal de la App -->
  <div id="app-container" class="hidden">
    
    <!-- Encabezado Fucsia Elegante -->
    <header class="app-header">
      <h2>Leire</h2>
      <p>Marca de Agua</p>
    </header>

    <!-- Contenido en una sola pantalla sin scroll -->
    <main class="main-layout">

      <!-- Inputs ocultos para archivos -->
      <input type="file" id="input-gallery" accept="image/*" style="display: none;">
      <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;">

      <!-- Area del Lienzo / Vista Previa -->
      <div class="editor-stage">
        <!-- Estado Inicial: Selector de origen -->
        <div id="upload-box" class="upload-box">
          <svg width="50" height="50" fill="none" stroke="#d63384" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <p>Selecciona una imagen para comenzar</p>
          <div class="button-group">
            <button type="button" id="btn-camera" class="btn btn-primary">
              📸 Usar Cámara
            </button>
            <button type="button" id="btn-gallery" class="btn btn-secondary">
              🖼️ Abrir Galería
            </button>
          </div>
        </div>

        <!-- Canvas donde se renderiza la foto con la marca de agua -->
        <canvas id="watermark-canvas" class="hidden"></canvas>
      </div>

      <!-- Panel de Controles de Edición -->
      <div id="editor-controls" class="controls-panel hidden">
        
        <div class="control-row">
          <label>Texto:</label>
          <input type="text" id="watermark-text" value="Leire" placeholder="Escribe tu marca...">
        </div>

        <div class="control-grid">
          <div class="control-col">
            <label>Color:</label>
            <input type="color" id="watermark-color" value="#ffffff">
          </div>
          <div class="control-col">
            <label>Tamaño:</label>
            <input type="range" id="watermark-size" min="15" max="100" value="35">
          </div>
          <div class="control-col">
            <label>Opacidad:</label>
            <input type="range" id="watermark-opacity" min="0.1" max="1" step="0.05" value="0.8">
          </div>
        </div>

        <div class="action-buttons">
          <button type="button" id="btn-reset" class="btn btn-danger">Cambiar Foto</button>
          <button type="button" id="btn-download" class="btn btn-success">⬇️ Descargar Foto</button>
        </div>

      </div>

    </main>
  </div>

  <script src="app.js"></script>

  <!-- Script añadido exclusivamente para habilitar el modo offline (Service Worker) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg))
          .catch(err => console.error('Error al registrar el Service Worker:', err));
      });
    }
  </script>
</body>
</html>
