<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Leire - Marca de Agua</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de Carga (Splash Screen) -->
  <div id="splash-screen">
    <h1 class="splash-logo">Leire</h1>
  </div>

  <!-- Contenedor Principal de la App -->
  <div id="app-container" class="hidden">
    
    <!-- Encabezado Fucsia Elegante -->
    <header class="app-header">
      <h2>Leire</h2>
      <p>Marca de Agua</p>
    </header>

    <!-- Contenido en una sola pantalla sin scroll -->
    <main class="main-layout">

      <!-- Inputs ocultos para archivos -->
      <input type="file" id="input-gallery" accept="image/*" style="display: none;">
      <input type="file" id="input-camera" accept="image/*" capture="environment" style="display: none;">
      <!-- Input oculto para cargar la imagen secundaria (Logo) -->
      <input type="file" id="input-logo" accept="image/*" style="display: none;">

      <!-- Area de Vista Previa optimizada con Capas DOM -->
      <div class="editor-stage">
        <!-- Estado Inicial: Selector de origen -->
        <div id="upload-box" class="upload-box">
          <svg width="50" height="50" fill="none" stroke="#d63384" stroke-width="2" viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <p>Selecciona una imagen para comenzar</p>
          <div class="button-group">
            <button type="button" id="btn-camera" class="btn btn-primary">
              📸 Usar Cámara
            </button>
            <button type="button" id="btn-gallery" class="btn btn-secondary">
              🖼️ Abrir Galería
            </button>
          </div>
        </div>

        <!-- Contenedor de Capas para arrastre ultra fluido -->
        <div id="preview-container" class="hidden" style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: none;">
          <img id="preview-img" style="max-width: 100%; max-height: 100%; object-fit: contain; pointer-events: none; user-select: none;" alt="Preview">
          
          <!-- Capa de Texto -->
          <div id="watermark-layer" style="position: absolute; cursor: grab; user-select: none; font-weight: bold; text-shadow: 0px 0px 6px rgba(0,0,0,0.6); white-space: nowrap; transform: translate(-50%, -50%);">Leire</div>
          
          <!-- Capa de Imagen / Logo secundario (inicialmente oculta) -->
          <img id="logo-layer" class="hidden" style="position: absolute; cursor: grab; user-select: none; max-width: 150px; max-height: 150px; transform: translate(-50%, -50%);" alt="Logo Marca">
        </div>

        <!-- Canvas oculto para procesar la imagen final al descargar -->
        <canvas id="export-canvas" style="display: none;"></canvas>
      </div>

      <!-- Panel de Controles de Edición -->
      <div id="editor-controls" class="controls-panel hidden">
        
        <!-- Selector de Tipo de Marca de Agua -->
        <div class="control-row">
          <label>Tipo de Marca:</label>
          <select id="watermark-type-selector" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px;">
            <option value="text">✍️ Texto Personalizado</option>
            <option value="image">🏷️ Imagen / Logotipo</option>
          </select>
        </div>

        <!-- Controles exclusivos para Texto -->
        <div id="text-controls-group">
          <div class="control-row">
            <label>Texto:</label>
            <input type="text" id="watermark-text" value="Leire" placeholder="Escribe tu marca...">
          </div>

          <div class="control-row">
            <label>Tipografía:</label>
            <select id="watermark-font" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #ccc; background: #fff; font-size: 14px;">
              <option value="sans-serif">Moderna (Sans-Serif)</option>
              <option value="serif">Elegante (Serif)</option>
              <option value="monospace">Técnica (Monospace)</option>
              <option value="'Courier New', Courier, monospace">Courier Clásica</option>
              <option value="'Georgia', serif">Georgia Estilizada</option>
            </select>
          </div>
        </div>

        <!-- Controles exclusivos para Imagen / Logo -->
        <div id="image-controls-group" class="hidden">
          <div class="control-row">
            <label>Logotipo:</label>
            <button type="button" id="btn-upload-logo" class="btn btn-secondary" style="width: 100%; font-size: 13px; padding: 8px;">
              📂 Seleccionar Imagen de Logo
            </button>
          </div>
        </div>

        <div class="control-grid">
          <div class="control-col" id="color-control-col">
            <label>Color:</label>
            <input type="color" id="watermark-color" value="#ffffff">
          </div>
          <div class="control-col">
            <label>Tamaño:</label>
            <input type="range" id="watermark-size" min="15" max="100" value="35">
          </div>
          <div class="control-col">
            <label>Opacidad:</label>
            <input type="range" id="watermark-opacity" min="0.1" max="1" step="0.05" value="0.8">
          </div>
        </div>

        <div class="action-buttons">
          <button type="button" id="btn-reset" class="btn btn-danger">Cambiar Foto</button>
          <button type="button" id="btn-download" class="btn btn-success">⬇️ Descargar Foto</button>
        </div>

      </div>

    </main>
  </div>

  <script src="app.js"></script>

  <!-- Script añadido exclusivamente para habilitar el modo offline (Service Worker) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado con éxito:', reg))
          .catch(err => console.error('Error al registrar el Service Worker:', err));
      });
    }
  </script>
</body>
</html>
